# Server Port
server.port=8080

# Application Name
spring.application.name=lms

# ===================================================================
# Database Configuration (MySQL)
# ===================================================================
# JDBC URL: Connects to local MySQL on default port 3306.
# - createDatabaseIfNotExist=true: Automatically creates 'lms_db' if it does not exist.
# - useSSL=false: Disables SSL for local development.
# - serverTimezone=UTC: Avoids timezone mismatches between application and MySQL server.
# - allowPublicKeyRetrieval=true: Required for MySQL 8+ caching_sha2_password authentication.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/lms_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:SoumyaSwain@31}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
# ddl-auto: 'update' automatically updates the schema (creates tables/columns) without dropping data.
spring.jpa.hibernate.ddl-auto=update

# Show and format generated SQL queries in console for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# Database Dialect for MySQL 8+
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Open-in-View: Disabled to avoid keeping DB connection open during view rendering (best practice for REST APIs)
spring.jpa.open-in-view=false

# ===================================================================
# Swagger / OpenAPI Configuration
# ===================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
